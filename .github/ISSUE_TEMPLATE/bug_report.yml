name: Bug report
description: Something is broken or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots or a short clip help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page
        2. Click "Enable camera"
        3. ...
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Room, Photo, Both / not sure]
  - type: dropdown
    id: source
    attributes:
      label: Tracking source
      options: [Face (webcam), Mouse]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 142 on macOS 26
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Screen and webcam
      placeholder: 14" laptop, built-in webcam
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open DevTools (F12) and paste anything red from the Console.
      render: text
